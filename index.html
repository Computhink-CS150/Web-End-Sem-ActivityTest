<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1720">
  <title>Skybound Siege</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5play/3.26.5/planck.min.js"></script>
  <script>window._p5play_gtagged = false;</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5play/3.26.5/p5play.js"></script>
</head>
<body>
  <main class="game-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">✦</span>
        <div>
          <p class="eyebrow">SLINGSHOT STUDIOS</p>
          <h1>Skybound Siege</h1>
        </div>
      </div>
      <div class="level-chip" id="levelLabel">LEVEL 01 <span>•</span> SUNSET OUTPOST</div>
      <div class="score-block">
        <span class="score-label">SCORE</span>
        <strong id="score">000000</strong>
      </div>
    </header>

    <section class="game-card" aria-label="Skybound Siege game">
      <div class="canvas-wrap">
        <div class="status-panel" id="statusPanel">
          <p class="status-kicker">OUTPOST BREACH</p>
          <h2 id="statusTitle">Take aim.</h2>
          <p id="statusMessage">Drag the scout back, then release to launch.</p>
          <button id="statusButton" type="button">Start siege</button>
        </div>
        <div class="toast" id="toast" role="status" aria-live="polite"></div>
      </div>
      <div class="controls">
        <div class="birds" id="birdTray" aria-label="Birds remaining"></div>
        <div class="hint"><span class="mouse-icon" aria-hidden="true">↖</span><span>DRAG TO AIM <b>•</b> RELEASE TO LAUNCH</span></div>
        <button class="reset-button" id="resetButton" type="button">↻ <span>RESET</span></button>
      </div>
    </section>

    <footer class="footer">
      <span><b>TIP</b> Hit the glass supports first to bring the towers down.</span>
      <span><a href="Game2.html">✦ PLAY NEON RUN</a> &nbsp; <kbd>R</kbd> reset level</span>
    </footer>
  </main>
  <script src="Game1.js"></script>
</body>
</html>
